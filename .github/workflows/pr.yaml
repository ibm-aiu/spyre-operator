name: Pull Request Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  GOTOOLCHAIN: auto

jobs:
  pre-commit:
    uses: ibm-aiu/spyre-operator-actions/.github/workflows/pre-commit.yaml@main

  check-api-docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check if api folder changed
      id: check-api
      run: |
        if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^api/'; then
          echo "api_changed=true" >> $GITHUB_OUTPUT
        else
          echo "api_changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up Go
      if: steps.check-api.outputs.api_changed == 'true'
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Generate API docs
      if: steps.check-api.outputs.api_changed == 'true'
      env:
        GOTOOLCHAIN: auto
      run: make api-docs

    - name: Check for uncommitted changes
      if: steps.check-api.outputs.api_changed == 'true'
      run: |
        if ! git diff --exit-code docs/api/; then
          echo "::error::API documentation is out of date. Please run 'make api-docs' and commit the changes."
          exit 1
        fi

  check-e2e-label:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check if source code affecting e2e changed
      id: check-src
      run: |
        changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
        echo "Changed files:"
        echo "$changed"
        if echo "$changed" | grep -qE '^(api/|cmd/|internal/|hack/|bundle/|config/|test/|Makefile|go\.mod|go\.sum|\.github/workflows/(pr|crc-e2e-test)\.yaml)'; then
          echo "src_changed=true" >> $GITHUB_OUTPUT
        else
          echo "src_changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Warn if ok-to-test label is missing
      if: steps.check-src.outputs.src_changed == 'true' && !contains(github.event.pull_request.labels.*.name,
        'ok-to-test')
      run: |
        echo "::error::Source code changes detected that may affect e2e tests, but the 'ok-to-test' label is missing. Please add the 'ok-to-test' label to trigger e2e tests, or confirm this change does not require e2e validation."
        exit 1

  unit-test:
    needs: pre-commit
    uses: ibm-aiu/spyre-operator-actions/.github/workflows/unit-test.yaml@main

  e2e-test:
    needs: unit-test
    if: contains(github.event.pull_request.labels.*.name, 'ok-to-test')
    uses: ibm-aiu/spyre-operator-actions/.github/workflows/crc-e2e-test.yaml@main
    with:
      runner: ubuntu-24.04
      branch-name: ${{ github.head_ref }}
      registry: ghcr.io/ibm-aiu
      pr-url: ${{ github.event.pull_request.html_url }}
    secrets:
      crc-pull-secret: ${{ secrets.CRC_PULL_SECRET }}
      github-token: ${{ secrets.GITHUB_TOKEN }}
