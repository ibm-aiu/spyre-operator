name: E2E Test CRC

on:
  # Run on all pushes to any branch
  push:
    branches:
    - '**'
    paths-ignore:
    - 'docs/**'
    - '**.md'
    - 'LICENSE'
    - '.gitignore'

  # Run on all pull requests
  pull_request:
    branches:
    - '**'
    paths-ignore:
    - 'docs/**'
    - '**.md'
    - 'LICENSE'
    - '.gitignore'

  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name to test'
        required: false
        type: string
        default: ''
      device_plugin_tag:
        description: 'Device Plugin Image Tag'
        required: false
        type: string
        default: ''
      exporter_tag:
        description: 'Metrics Exporter Image tag'
        required: false
        type: string
        default: ''
      feature_discovery_tag:
        description: 'Feature discovery Image tag'
        required: false
        type: string
        default: ''
      scheduler_plugin_tag:
        description: 'Spyre scheduler plugin tag'
        required: false
        type: string
        default: ''
      validator_tag:
        description: 'Spyre pod validator tag'
        required: false
        type: string
        default: ''
      health_checker_tag:
        description: 'Spyre health checker tag'
        required: false
        type: string
        default: ''
      operator_tag:
        description: 'Spyre operator tag'
        required: false
        type: string
        default: ''
      bundle_tag:
        description: 'Spyre operator-bundle tag'
        required: false
        type: string
        default: ''
      catalog_tag:
        description: 'Spyre operator-catalog tag'
        required: false
        type: string
        default: ''
      crc_cpus:
        description: 'CRC CPUs'
        required: false
        type: string
        default: '16'
      crc_memory:
        description: 'CRC Memory (MiB)'
        required: false
        type: string
        default: '15000'
      crc_disk_size:
        description: 'CRC Disk Size (GiB)'
        required: false
        type: string
        default: '128'

permissions:
  contents: read
  packages: write # Crucial for pushing to ghcr.io

env:
  GOTOOLCHAIN: go1.24.13
  HAS_DEVICE: 'false'
  GHCR_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  e2e-test-crc-github-hosted:
    name: E2E Test with CRC (GitHub-Hosted Runner)
    runs-on: ubuntu-latest  # Standard GitHub-hosted runner
    timeout-minutes: 360  # 6 hours (GitHub limit)
    
    permissions:
      contents: read
      packages: write  # Required for GitHub Container Registry
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch_name || github.ref }}
          fetch-depth: 0

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: true

      - name: Display Configuration
        run: |
          echo "=========================================="
          echo "E2E Test CRC (GitHub-Hosted)"
          echo "=========================================="
          echo "Branch: ${{ inputs.branch_name || github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "CRC CPUs: ${{ inputs.crc_cpus || '16' }}"
          echo "CRC Memory: ${{ inputs.crc_memory || '15000' }} MiB"
          echo "CRC Disk: ${{ inputs.crc_disk_size || '128' }} GiB"
          echo "Registry: ${{ env.GHCR_REGISTRY }}"
          echo "=========================================="

      - name: Enable KVM Support
        run: |
          echo "=========================================="
          echo "Checking KVM and Virtualization Support"
          echo "=========================================="
          
          # Check CPU virtualization support
          echo "CPU Info:"
          if grep -E 'vmx|svm' /proc/cpuinfo > /dev/null; then
            echo "✅ CPU supports virtualization ($(grep -E 'vmx|svm' /proc/cpuinfo | wc -l) cores)"
          else
            echo "❌ CPU does not support virtualization"
            echo "This runner may not support nested virtualization required for CRC"
          fi
          
          # Check if KVM module is loaded
          echo ""
          echo "KVM Modules:"
          lsmod | grep kvm || echo "⚠️  KVM modules not loaded"
          
          # Check /dev/kvm
          echo ""
          echo "KVM Device:"
          if [ -e /dev/kvm ]; then
            echo "✅ /dev/kvm exists"
            ls -la /dev/kvm
          else
            echo "❌ /dev/kvm does not exist"
          fi
          
          # Install required packages
          echo ""
          echo "Installing virtualization packages..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qemu-kvm \
            qemu-utils \
            libvirt-daemon-system \
            libvirt-clients \
            libvirt-daemon-driver-qemu \
            bridge-utils \
            cpu-checker \
            virtiofsd
          
          # Check virtualization capability
          echo ""
          echo "Virtualization Check:"
          kvm-ok || true
          
          # Verify virtiofsd is installed
          echo ""
          echo "Checking virtiofsd:"
          which virtiofsd || echo "⚠️  virtiofsd not found in PATH"
          if [ -f /usr/lib/qemu/virtiofsd ]; then
            echo "✅ virtiofsd found at /usr/lib/qemu/virtiofsd"
            ls -la /usr/lib/qemu/virtiofsd
          elif [ -f /usr/libexec/virtiofsd ]; then
            echo "✅ virtiofsd found at /usr/libexec/virtiofsd"
            ls -la /usr/libexec/virtiofsd
          else
            echo "⚠️  virtiofsd not found in standard locations"
          fi
          
          # Configure libvirt
          echo ""
          echo "Configuring libvirt..."
          sudo systemctl start libvirtd
          sudo systemctl enable libvirtd
          
          # Add user to groups
          sudo usermod -aG libvirt $USER
          sudo usermod -aG kvm $USER
          
          # Set permissions on /dev/kvm
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "✅ /dev/kvm permissions set to 666"
            ls -la /dev/kvm
          fi
          
          # Verify libvirt is running
          echo ""
          echo "Libvirt Status:"
          sudo systemctl status libvirtd --no-pager || true
          
          # Check groups
          echo ""
          echo "User Groups:"
          groups
          id
          
          echo ""
          echo "✅ KVM support configuration completed"
          echo "=========================================="

      - name: Setup CRC Cluster
        env:
          CRC_PULL_SECRET: ${{ secrets.CRC_PULL_SECRET }}
        run: |
          echo "=========================================="
          echo "Setting up CRC Cluster"
          echo "=========================================="
          
          # Check if pull secret is available
          if [ -z "$CRC_PULL_SECRET" ]; then
            echo "❌ ERROR: CRC_PULL_SECRET is not set"
            echo ""
            echo "To fix this:"
            echo "1. Get your pull secret from: https://console.redhat.com/openshift/create/local"
            echo "2. Add it as a repository secret named 'CRC_PULL_SECRET'"
            echo "3. Go to: Settings > Secrets and variables > Actions > New repository secret"
            echo ""
            exit 1
          fi
          
          # Download and install CRC
          echo "Downloading CRC..."
          CRC_VERSION="latest"
          wget -q https://developers.redhat.com/content-gateway/rest/mirror/pub/openshift-v4/clients/crc/latest/crc-linux-amd64.tar.xz
          tar -xf crc-linux-amd64.tar.xz
          sudo mv crc-linux-*-amd64/crc /usr/local/bin/
          rm -rf crc-linux-*
          
          # Verify CRC installation
          crc version
          
          # Setup CRC with proper group context
          echo ""
          echo "Setting up CRC (this may take several minutes)..."
          
          # Run setup with sg to use libvirt group
          sg libvirt -c "crc setup"
          
          # Configure CRC
          crc config set cpus ${{ inputs.crc_cpus || '16' }}
          crc config set memory ${{ inputs.crc_memory || '15000' }}
          crc config set disk-size ${{ inputs.crc_disk_size || '128' }}
          crc config set preset openshift
          
          # Save pull secret to file
          echo "$CRC_PULL_SECRET" > /tmp/pull-secret.txt
          
          # Start CRC with proper group context and pull secret
          echo ""
          echo "Starting CRC cluster (this will take 10-15 minutes)..."
          sg libvirt -c "crc start --pull-secret-file /tmp/pull-secret.txt --log-level debug"
          
          # Clean up pull secret
          rm -f /tmp/pull-secret.txt
          
          # Setup oc command
          eval $(crc oc-env)
          
          echo ""
          echo "✅ CRC cluster setup completed"
          echo "=========================================="

      - name: Verify CRC Cluster
        run: |
          echo "=========================================="
          echo "Verifying CRC Cluster"
          echo "=========================================="
          
          # Setup oc environment and export to PATH
          eval $(crc oc-env)
          export PATH="$PATH:$HOME/.crc/bin/oc"
          
          # Copy oc to a location in PATH for persistence
          OC_PATH=$(sg libvirt -c "crc oc-env" | grep "export PATH" | sed 's/.*PATH="\([^"]*\)".*/\1/' | cut -d: -f1)
          if [ -n "$OC_PATH" ] && [ -f "$OC_PATH/oc" ]; then
            sudo cp "$OC_PATH/oc" /usr/local/bin/
            echo "✅ oc command copied to /usr/local/bin/"
          fi
          
          # Verify oc is available
          echo ""
          echo "Checking oc command:"
          which oc || echo "⚠️  oc not found in PATH"
          oc version --client || echo "⚠️  oc version failed"
          
          # Display CRC version
          echo ""
          crc version
          
          # Get cluster credentials (this works even if status check fails)
          echo ""
          echo "Cluster Credentials:"
          sg libvirt -c "crc console --credentials" || true
          
          # Wait for OpenShift API to be ready (more reliable than crc status)
          echo ""
          echo "Waiting for OpenShift API to be ready..."
          max_attempts=60
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if oc get nodes &>/dev/null; then
              echo "✅ OpenShift API is responding"
              break
            else
              echo "Waiting for OpenShift API... (attempt $((attempt+1))/$max_attempts)"
              sleep 10
              attempt=$((attempt+1))
            fi
          done
          
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ Timeout waiting for OpenShift API"
            echo ""
            echo "Debugging information:"
            echo "PATH: $PATH"
            echo "oc location: $(which oc || echo 'not found')"
            echo ""
            echo "Attempting to get CRC status:"
            sg libvirt -c "crc status" || true
            echo ""
            echo "Attempting oc commands:"
            oc version || true
            oc get nodes || true
            exit 1
          fi
          
          # Verify OpenShift cluster is functional
          echo ""
          echo "Verifying OpenShift cluster..."
          oc version
          
          echo ""
          echo "Cluster Nodes:"
          oc get nodes
          
          echo ""
          echo "Cluster Operators:"
          oc get co
          
          echo ""
          echo "All Pods:"
          oc get pods --all-namespaces | head -20
          
          # Try to get CRC status (may show warning but cluster is working)
          echo ""
          echo "CRC Status (informational, may show libvirt warning):"
          sg libvirt -c "crc status" || echo "Note: CRC status check shows warning but cluster is operational"
          
          echo ""
          echo "✅ CRC cluster is ready and verified"
          echo "=========================================="

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Images
        env:
          REGISTRY: ${{ env.GHCR_REGISTRY }}
          VERSION: ${{ inputs.operator_tag || '1.3.0-dev' }}
        run: |
          echo "=========================================="
          echo "Building and Pushing Images to GHCR"
          echo "=========================================="
          echo "Registry: $REGISTRY"
          echo "Version: $VERSION"
          echo ""
          
          # Function to retry push with exponential backoff
          retry_push() {
            local cmd="$1"
            local max_attempts=5
            local attempt=1
            local delay=5
            
            while [ $attempt -le $max_attempts ]; do
              echo "Push attempt $attempt/$max_attempts..."
              if eval "$cmd"; then
                echo "✅ Push successful"
                return 0
              else
                if [ $attempt -lt $max_attempts ]; then
                  echo "⚠️  Push failed, retrying in ${delay}s..."
                  sleep $delay
                  delay=$((delay * 2))
                  attempt=$((attempt + 1))
                else
                  echo "❌ Push failed after $max_attempts attempts"
                  return 1
                fi
              fi
            done
          }
          
          # Build operator image
          echo "Building operator image..."
          make docker-build IMG=$REGISTRY/spyre-operator:$VERSION
          retry_push "make docker-push IMG=$REGISTRY/spyre-operator:$VERSION"
          echo "✅ Operator image pushed"
          
          # Build bundle image
          echo ""
          echo "Building bundle image..."
          make bundle-build BUNDLE_IMG=$REGISTRY/spyre-operator-bundle:$VERSION
          retry_push "make bundle-push BUNDLE_IMG=$REGISTRY/spyre-operator-bundle:$VERSION"
          echo "✅ Bundle image pushed"
          
          # Build catalog image (File Based Catalog)
          echo ""
          echo "Building catalog image..."
          make fbc-build CATALOG_IMG=$REGISTRY/spyre-operator-catalog:$VERSION BUNDLE_IMG=$REGISTRY/spyre-operator-bundle:$VERSION
          retry_push "make fbc-push CATALOG_IMG=$REGISTRY/spyre-operator-catalog:$VERSION"
          echo "✅ Catalog image pushed"
          
          echo ""
          echo "✅ All images built and pushed successfully"
          echo "=========================================="

      - name: Configure OpenShift Pull Secret for GHCR
        run: |
          echo "=========================================="
          echo "Configuring Pull Secrets for GHCR"
          echo "=========================================="
          
          # Create docker config JSON with GitHub token
          DOCKER_CONFIG=$(echo -n "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64 -w 0)
          
          # Create pull secret JSON
          cat > /tmp/ghcr-pull-secret.json << EOF
          {
            "auths": {
              "ghcr.io": {
                "auth": "${DOCKER_CONFIG}",
                "email": "${{ github.actor }}@users.noreply.github.com"
              }
            }
          }
          EOF
          
          # Update global pull secret
          echo "Updating global pull secret..."
          oc get secret/pull-secret -n openshift-config -o jsonpath='{.data.\.dockerconfigjson}' | \
            base64 -d > /tmp/existing-pull-secret.json
          
          jq -s '.[0] * .[1]' /tmp/existing-pull-secret.json /tmp/ghcr-pull-secret.json > /tmp/merged-pull-secret.json
          
          oc set data secret/pull-secret -n openshift-config \
            --from-file=.dockerconfigjson=/tmp/merged-pull-secret.json
          
          echo "✅ Global pull secret updated"
          
          # Create pull secret in openshift-marketplace namespace for catalog source
          echo ""
          echo "Creating pull secret in openshift-marketplace namespace..."
          oc create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --docker-email="${{ github.actor }}@users.noreply.github.com" \
            -n openshift-marketplace \
            --dry-run=client -o yaml | oc apply -f -
          
          echo "✅ Marketplace pull secret created"
          
          # Link the secret to the default service account in marketplace
          echo ""
          echo "Linking pull secret to service accounts..."
          oc secrets link default ghcr-pull-secret --for=pull -n openshift-marketplace || true
          oc secrets link builder ghcr-pull-secret --for=pull -n openshift-marketplace || true
          
          echo "✅ Pull secrets linked"
          
          # Wait for nodes to pick up the new global pull secret
          echo ""
          echo "Waiting for nodes to sync pull secret (30 seconds)..."
          sleep 30
          
          # Clean up
          rm -f /tmp/*pull-secret.json
          
          echo ""
          echo "✅ All pull secrets configured for GHCR"
          echo "=========================================="

      - name: Install Test Tools
        run: |
          echo "Installing test tools..."
          make ginkgo jq yq
          
          # Install stern manually (no Makefile target exists)
          echo "Installing stern..."
          STERN_VERSION="1.30.0"
          curl -sL "https://github.com/stern/stern/releases/download/v${STERN_VERSION}/stern_${STERN_VERSION}_linux_amd64.tar.gz" | \
            tar xz -C bin/ stern
          chmod +x bin/stern
          
          echo "✅ Test tools installed"

      - name: Patch Test Configuration
        env:
          EXPORTER_TAG: ${{ inputs.exporter_tag }}
          DEVICE_PLUGIN_TAG: ${{ inputs.device_plugin_tag }}
          FEATURE_DISCOVERY_TAG: ${{ inputs.feature_discovery_tag }}
          SCHEDULER_PLUGIN_TAG: ${{ inputs.scheduler_plugin_tag }}
          VALIDATOR_TAG: ${{ inputs.validator_tag }}
          HEALTH_CHECKER_TAG: ${{ inputs.health_checker_tag }}
          OPERATOR_TAG: ${{ inputs.operator_tag }}
          BUNDLE_TAG: ${{ inputs.bundle_tag }}
          CATALOG_TAG: ${{ inputs.catalog_tag }}
        run: |
          echo "Patching test configuration..."
          ./test/script/patch-e2e-config.bash
          
          echo ""
          echo "Test Configuration:"
          echo "=========================================="
          bin/yq '.' test/config.yaml
          echo "=========================================="

      - name: Skip MachineConfig for CRC
        run: |
          echo "=========================================="
          echo "Skipping MachineConfig for CRC"
          echo "=========================================="
          echo ""
          echo "Note: MachineConfig is designed for multi-node production clusters."
          echo "CRC is a single-node development cluster and applying MachineConfig"
          echo "that triggers node reboots can cause the cluster to become unavailable."
          echo ""
          echo "For CRC testing, SELinux policies will be handled differently or"
          echo "the device plugin will run in a mode that doesn't require them."
          echo ""
          echo "Current cluster status:"
          oc get nodes
          oc get co | head -10
          echo ""
          echo "✅ Skipping MachineConfig step"
          echo "=========================================="

      - name: Create Barrier for Log Capture
        run: touch stern.barrier

      - name: Start Log Capture - Operator
        run: |
          hack/capture-logs.bash spyre-operator spyre-operator stern.barrier &
          echo $! > /tmp/log-capture-operator.pid

      - name: Start Log Capture - Device Plugin
        run: |
          hack/capture-logs.bash spyre-device-plugin spyre-operator stern.barrier &
          echo $! > /tmp/log-capture-device-plugin.pid

      - name: Start Log Capture - Validator
        run: |
          hack/capture-logs.bash spyre-webhook-validator spyre-operator stern.barrier &
          echo $! > /tmp/log-capture-validator.pid

      - name: Start Log Capture - Health Checker
        run: |
          hack/capture-logs.bash spyre-health-checker spyre-operator stern.barrier &
          echo $! > /tmp/log-capture-health-checker.pid

      - name: Start Log Capture - Metrics Exporter
        run: |
          hack/capture-logs.bash spyre-metrics-exporter spyre-operator stern.barrier &
          echo $! > /tmp/log-capture-metrics-exporter.pid

      - name: Start Log Capture - Scheduler
        run: |
          hack/capture-logs.bash secondary-scheduler openshift-secondary-scheduler-operator stern.barrier &
          echo $! > /tmp/log-capture-scheduler.pid

      - name: Start Log Capture - Card Management
        run: |
          hack/capture-logs.bash spyre-card-management spyre-operator stern.barrier &
          echo $! > /tmp/log-capture-card-management.pid

      - name: Verify Catalog Image
        env:
          REGISTRY: ${{ env.GHCR_REGISTRY }}
          VERSION: ${{ inputs.operator_tag || '1.3.0-dev' }}
        run: |
          echo "=========================================="
          echo "Verifying Catalog Image"
          echo "=========================================="
          
          CATALOG_IMAGE="$REGISTRY/spyre-operator-catalog:$VERSION"
          echo "Catalog Image: $CATALOG_IMAGE"
          
          echo ""
          echo "Attempting to pull catalog image..."
          if podman pull "$CATALOG_IMAGE"; then
            echo "✅ Catalog image pulled successfully"
            echo ""
            echo "Image details:"
            podman inspect "$CATALOG_IMAGE" | jq -r '.[0] | {Created, Size, Architecture, Os}'
          else
            echo "❌ Failed to pull catalog image"
            echo "This will cause the catalog source pod to fail"
            exit 1
          fi
          
          echo "=========================================="

      - name: Debug Marketplace Status
        run: |
          echo "=========================================="
          echo "Checking Marketplace Status (Before Tests)"
          echo "=========================================="
          
          echo "Catalog Sources:"
          oc get catalogsources -n openshift-marketplace
          
          echo ""
          echo "Marketplace Pods:"
          oc get pods -n openshift-marketplace
          
          echo ""
          echo "Pull Secrets in Marketplace:"
          oc get secrets -n openshift-marketplace | grep pull
          
          echo ""
          echo "Service Account Secrets:"
          oc get sa default -n openshift-marketplace -o yaml | grep -A 5 imagePullSecrets || echo "No imagePullSecrets configured"
          
          echo ""
          echo "Note: The ibm-spyre-operators catalog source will be created by the E2E test"
          echo "=========================================="

      - name: Start Marketplace Monitoring
        run: |
          test/script/monitor-openshift-marketplace.bash stern.barrier &
          echo $! > /tmp/marketplace-monitor.pid

      - name: Run End-to-End Tests
        run: |
          echo "Running E2E tests..."
          make e2e-test
          TEST_RC=$?
          
          echo "Stopping log capture..."
          rm -f stern.barrier
          sleep 5
          
          if [ $TEST_RC -eq 0 ]; then
            echo "✅ E2E tests passed"
          else
            echo "❌ E2E tests failed with exit code $TEST_RC"
          fi
          
          exit $TEST_RC

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-crc-github-hosted-${{ github.run_number }}
          path: |
            test/results/
            logs/
            *.log
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs-crc-github-hosted-${{ github.run_number }}
          path: |
            **/*.log
            **/stern.*.log
          retention-days: 30
          if-no-files-found: warn

      - name: Send Slack Notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          JOB_NAME: ${{ github.workflow }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            python3 -m pip install --user requests
            python3 hack/slack-notifier.py \
              --job_status "${JOB_STATUS}" \
              --job_name "${JOB_NAME}" \
              --build_url "${BUILD_URL}"
          else
            echo "⚠️  SLACK_WEBHOOK_URL not configured, skipping notification"
          fi

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up..."
          
          # Kill background processes
          for pid_file in /tmp/log-capture-*.pid /tmp/marketplace-monitor.pid; do
            if [ -f "$pid_file" ]; then
              pid=$(cat "$pid_file")
              kill $pid 2>/dev/null || true
              rm -f "$pid_file"
            fi
          done
          
          # Remove barrier file
          rm -f stern.barrier
          
          echo "✅ Cleanup completed"
          echo ""
          echo "Note: CRC cluster will be automatically stopped by crc-github-action"