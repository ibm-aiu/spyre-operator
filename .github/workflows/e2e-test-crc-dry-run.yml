name: E2E Test CRC (Dry Run - No GCP)

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name to test'
        required: false
        type: string
        default: ''
      crc_cpus:
        description: 'CRC CPUs'
        required: false
        type: string
        default: '16'
      crc_memory:
        description: 'CRC Memory (MiB)'
        required: false
        type: string
        default: '24000'
      crc_disk_size:
        description: 'CRC Disk Size (GiB)'
        required: false
        type: string
        default: '128'

env:
  GOTOOLCHAIN: go1.23
  HAS_DEVICE: 'false'
  # GCAR_REGISTRY: us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/spyre-images  # COMMENTED FOR DRY RUN

jobs:
  e2e-test-crc-dry-run:
    name: E2E Test CRC Dry Run (No GCP)
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours (GitHub limit)

    permissions:
      contents: read
      # id-token: write  # COMMENTED - Required for Workload Identity Federation (not needed for dry run)

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch_name || github.ref }}
        fetch-depth: 0

    - name: Setup Go environment
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true

    - name: Display Configuration
      run: |
        echo "=========================================="
        echo "E2E Test CRC DRY RUN (No GCP)"
        echo "=========================================="
        echo "Branch: ${{ inputs.branch_name || github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "CRC CPUs: ${{ inputs.crc_cpus || '16' }}"
        echo "CRC Memory: ${{ inputs.crc_memory || '24000' }} MiB"
        echo "CRC Disk: ${{ inputs.crc_disk_size || '128' }} GiB"
        echo "⚠️  DRY RUN MODE - GCP/GCAR disabled"
        echo "=========================================="

    - name: Setup CRC Cluster
      uses: crc-org/crc-github-action@v1
      with:
        crc-version: latest
        cpus: ${{ inputs.crc_cpus || '16' }}
        memory: ${{ inputs.crc_memory || '24000' }}
        disk-size: ${{ inputs.crc_disk_size || '128' }}

    - name: Verify CRC Cluster
      run: |
        echo "Verifying CRC cluster..."
        crc version
        crc status

        echo ""
        echo "Verifying OpenShift access..."
        oc version
        oc get nodes
        oc get co

        echo ""
        echo "✅ CRC cluster is ready"

