    - name: Apply MachineConfig
      timeout-minutes: 15
      run: |
        echo "Applying MachineConfig for device plugin..."

        # Apply MachineConfig (change worker to master for CRC)
        cat config/machineconfig/amd64/50-spyre-device-plugin-selinux-minimal.yaml | \
          sed -e 's@machineconfiguration.openshift.io/role: worker@machineconfiguration.openshift.io/role: master@g' | \
          oc apply -f -

        echo "Waiting for MachineConfig to be applied..."
        sleep 120

        # Wait for CRC to be running
        echo "Waiting for OpenShift cluster to be running..."
        max_attempts=60
        attempt=0
        while [ $attempt -lt $max_attempts ]; do
          status=$(crc status -o json | jq -r ".openshiftStatus" 2>/dev/null || echo "Unknown")
          if [ "$status" == "Running" ]; then
            echo "✅ OpenShift cluster is running"
            break
          else
            echo "Waiting... (attempt $((attempt+1))/$max_attempts, status: $status)"
            sleep 5
            attempt=$((attempt+1))
          fi
        done

        if [ $attempt -eq $max_attempts ]; then
          echo "❌ Timeout waiting for OpenShift cluster"
          exit 1
        fi

        echo "✅ MachineConfig applied successfully"

    - name: Verify Cluster State
      run: |
        echo "Verifying cluster state after MachineConfig..."
        echo ""
        echo "Nodes:"
        oc get nodes -o wide
        echo ""
        echo "Cluster Operators:"
        oc get co
        echo ""
        echo "Machine Configs:"
        oc get machineconfig | grep spyre || echo "No spyre machineconfigs found"
        echo ""
        echo "✅ Cluster verification complete"

    - name: Test Basic Operator Deployment (Dry Run)
      run: |
        echo "Testing basic operator deployment capabilities..."
        echo ""
        echo "Creating test namespace..."
        oc create namespace spyre-operator-test || true

        echo ""
        echo "Checking if we can create basic resources..."
        cat << EOF | oc apply -f - || true
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: test-config
          namespace: spyre-operator-test
        data:
          test: "dry-run-success"
        EOF

        echo ""
        echo "Verifying resource creation..."
        oc get configmap test-config -n spyre-operator-test -o yaml || echo "ConfigMap not found"

        echo ""
        echo "Cleaning up test resources..."
        oc delete namespace spyre-operator-test --wait=false || true

        echo ""
        echo "✅ Basic deployment test complete"

