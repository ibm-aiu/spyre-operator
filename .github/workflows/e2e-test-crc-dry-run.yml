          bin/yq '.' test/config.yaml || cat test/config.yaml
        else
          echo "⚠️  test/config.yaml not found"
        fi
        echo "=========================================="
        echo ""
        echo "⚠️  NOTE: In dry run mode, using default registry configuration"
        echo "⚠️  For full testing, configure GCP/GCAR and use the main workflow"

