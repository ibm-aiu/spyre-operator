apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: spyre-privileged-vf
spec:
  selectors:
  - cel:
      expression: >
        device.driver == 'spyre.ibm.com' && device.attributes["spyre.ibm.com"].pciFunctionIndex
        == 1
