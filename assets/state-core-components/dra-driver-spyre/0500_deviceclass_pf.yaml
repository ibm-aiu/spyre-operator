# spyre-pf: PF (productId 06a7) devices without card management.
# Generally available for users.

apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: spyre-pf
spec:
  selectors:
  - cel:
      expression: >
        device.driver == 'spyre.ibm.com' && device.attributes["spyre.ibm.com"].productId
        == "06a7"
  # only healthy devices are allocatable
  - cel:
      expression: >
        device.attributes["spyre.ibm.com"].deviceState == 'ONLINE'
  # not managed by card management
  - cel:
      expression: >
        !has(device.attributes["spyre.ibm.com"].managed) ||
          device.attributes["spyre.ibm.com"].managed == false
