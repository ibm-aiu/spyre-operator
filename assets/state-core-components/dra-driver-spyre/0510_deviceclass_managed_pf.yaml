# spyre-managed-pf: PF (productId 06a7) devices with card management enabled.
# Restricted to privileged namespaces (e.g. spyre-operator).

apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: spyre-managed-pf
spec:
  selectors:
  - cel:
      expression: >
        device.driver == 'spyre.ibm.com' && device.attributes["spyre.ibm.com"].productId
        == "06a7"
  # managed by card management
  - cel:
      expression: >
        has(device.attributes["spyre.ibm.com"].managed) && device.attributes["spyre.ibm.com"].managed
        == true
