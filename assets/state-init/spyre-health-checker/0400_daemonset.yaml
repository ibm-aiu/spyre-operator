apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: spyre-health-checker
  name: spyre-health-checker
  namespace: "FILLED BY THE OPERATOR"
spec:
  selector:
    matchLabels:
      app: spyre-health-checker
  template:
    metadata:
      labels:
        app: spyre-health-checker
    spec:
      containers:
      - image: "FILLED BY THE OPERATOR"
        args:
        - --timer
        - $(CHECK_INTERVAL)
        - --socket
        - $(SPYRE_HEALTH_SOCK)
        imagePullPolicy: Always
        name: checker
        securityContext:
          runAsUser: 1001
          runAsGroup: 0
          runAsNonRoot: true
          privileged: false
          seLinuxOptions:
            type: spc_t
        env:
        - name: SPYRE_HEALTH_SOCK
          value: /usr/local/etc/device-plugins/spyre-sockets/health-checker.sock
        - name: CHECK_INTERVAL
          value: "30s"
        - name: "NODE_NAME"
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: "NAMESPACE"
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: "POD_NAME"
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: device-plugin-sockets
          mountPath: /usr/local/etc/device-plugins/spyre-sockets
          readOnly: false
        - name: spyre-cert
          mountPath: /etc/spyre-health-checker/certs
          readOnly: true
        - name: cardmgmt-health-api-socket
          mountPath: /var/run/cardmgmt-health-check-api
          readOnly: true
        # Optional node health override. The file <mountPath>/<node name> holds "healthy" or "unhealthy".
        - name: health-override
          mountPath: /etc/spyre-health-checker/override
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 10Mi
          limits:
            cpu: 500m
            memory: 500Mi
        ports:
        - name: health
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 30
      nodeSelector:
        ibm.com/spyre.present: "true"
      tolerations:
      - key: ibm.com/spyre
        operator: Exists
        effect: NoSchedule
      priorityClassName: system-node-critical
      serviceAccountName: spyre-health-checker
      volumes:
      - name: device-plugin-sockets
        hostPath:
          path: /usr/local/etc/device-plugins/spyre-sockets
          type: DirectoryOrCreate
      - name: spyre-cert
        secret:
          secretName: spyre-cert
      - name: cardmgmt-health-api-socket
        # Host directory shared with the card management DaemonSet's health-api sidecar
        # (assets/state-plugin-components/spyre-card-management/0600_daemonset.yaml.tmpl and
        # const.CardManagementHealthApiSocketHostPath). The two MUST be the same directory,
        # or the cardmgmt reporter cannot see the sidecar's socket.
        hostPath:
          path: /usr/local/etc/spyre-cardmgmt
          type: DirectoryOrCreate
      - name: health-override
        # Optional ConfigMap spyre-health-override, created by an administrator (the operator never
        # creates it). A key named after a node, with the value "healthy" or "unhealthy", forces the
        # health of every Spyre device on that node. Without the ConfigMap the volume is empty and
        # nothing changes. The mount must not use subPath, or kubelet would never update the files.
        configMap:
          name: spyre-health-override
          optional: true
