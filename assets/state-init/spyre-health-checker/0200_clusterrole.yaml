apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spyre-health-checker
rules:
- apiGroups:
  - security.openshift.io
  resources:
  - securitycontextconstraints
  verbs:
  - use
  resourceNames:
  - spyre-operator-nonroot
- apiGroups:
  - ""
  resources:
  - pods
  - pods/log
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - resource.k8s.io
  resources:
  - resourceclaims
  verbs:
  - get
# The health checker reads the labels of its own Node (spyre.ibm.com/health-override).
# A ClusterRole cannot be limited to one node name here, so this is read-only access to all nodes.
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
