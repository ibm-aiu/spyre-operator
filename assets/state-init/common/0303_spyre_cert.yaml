apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: spyre-cert
  namespace: "FILLED BY THE OPERATOR"
spec:
  secretName: spyre-cert
  duration: 8760h
  renewBefore: 720h
  commonName: spyre-components
  dnsNames:
  - spyre-components
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
  - digital signature
  - key encipherment
  - client auth
  - server auth
  issuerRef:
    name: spyre-ca-issuer
    kind: Issuer
  subject:
    organizations:
    - "spyre-operator"
