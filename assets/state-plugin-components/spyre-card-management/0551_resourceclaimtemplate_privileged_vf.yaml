# Privileged VF counterpart of 0550_resourceclaimtemplate_pf.yaml. See that
# file for why PF and VF devices are requested through separate templates.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: spyre-card-management-privileged-vf
  namespace: "FILLED BY THE OPERATOR"
  labels:
    app: cardmgmt
spec:
  spec:
    devices:
      requests:
      - name: spyre-privileged-vf
        exactly:
          deviceClassName: spyre-privileged-vf
          allocationMode: All
