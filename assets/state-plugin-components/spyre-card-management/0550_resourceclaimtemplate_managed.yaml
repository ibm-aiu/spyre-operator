# This ResourceClaimTemplate is created unconditionally as part of the
# spyre-card-management component. It is inert on its own: a ResourceClaim is
# only instantiated when a Pod references it via resourceClaimTemplateName.
# In device-plugin mode nothing references it, so it has no effect. The
# card-management DaemonSet references it only when DevicePlugin.DRADriver is
# enabled (see TransformCardManagement in internal/state/transform.go).
#
# A single claim holds two requests: one for all managed PF devices and one
# for all managed VF devices.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: spyre-card-management
  namespace: "FILLED BY THE OPERATOR"
  labels:
    app: cardmgmt
spec:
  spec:
    devices:
      requests:
      - name: spyre-managed-pf
        exactly:
          deviceClassName: spyre-managed-pf
          allocationMode: All
      - name: spyre-managed-vf
        exactly:
          deviceClassName: spyre-managed-vf
          allocationMode: All
