apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spyre-metrics-exporter
  namespace: "FILLED BY THE OPERATOR"
  labels:
    app: spyre-metrics-exporter
    app.kubernetes.io/part-of: spyre
spec:
  selector:
    matchLabels:
      app: spyre-metrics-exporter
      app.kubernetes.io/part-of: spyre
  template:
    metadata:
      labels:
        app: spyre-metrics-exporter
        app.kubernetes.io/part-of: spyre
    spec:
      nodeSelector:
        ibm.com/spyre.present: "true"
      tolerations:
      - key: ibm.com/spyre
        operator: Exists
        effect: NoSchedule
      priorityClassName: system-node-critical
      serviceAccount: spyre-metrics-exporter
      initContainers:
      - name: init-ctk
        image: "FILLED BY THE OPERATOR"
        securityContext:
          runAsUser: 1001
          runAsGroup: 0
          runAsNonRoot: true
          privileged: false
          seLinuxOptions:
            type: spc_t
        command:
        - /bin/sh
        - -c
        - |
          set -e
          mkdir -p /mnt/spyre/senlib/etc /mnt/spyre/senlib/lib
          cp -a /opt/ibm/spyre/senlib/etc/. /mnt/spyre/senlib/etc/
          cp -a /opt/ibm/spyre/senlib/lib/.       /mnt/spyre/senlib/lib/
          cp -a /opt/ibm/spyre/aiu-monitor/lib/.  /mnt/spyre/senlib/lib/
          cp -a /usr/lib64/libhwloc.so*           /mnt/spyre/senlib/lib/
          cp -a /usr/lib64/libboost_*.so*         /mnt/spyre/senlib/lib/
          cp -a /usr/lib64/libicu*.so*            /mnt/spyre/senlib/lib/
          cp -a /usr/lib64/libudev.so*            /mnt/spyre/senlib/lib/ 2> /dev/null || true
          cp -a /usr/lib64/libpciaccess.so*       /mnt/spyre/senlib/lib/ 2> /dev/null || true
          cp -a /usr/lib64/libOpenCL.so*          /mnt/spyre/senlib/lib/ 2> /dev/null || true
        volumeMounts:
        - name: spyre-senlib
          mountPath: /mnt/spyre
      containers:
      - image: "FILLED BY THE OPERATOR"
        name: spyre-metrics-exporter
        ports:
        - name: spyre-metrics
          containerPort: 8082
          protocol: TCP
        env:
        - name: MONITOR_PORT
          value: "8082"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          request:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - name: spyre-config
          mountPath: /tmp/spyre-config
        - name: spyre-metrics
          mountPath: /tmp/spyre-metrics
        - name: spyre-metadata
          mountPath: /tmp/spyre-metadata
        - name: spyre-senlib
          mountPath: /opt/ibm/spyre/senlib/lib
          subPath: senlib/lib
          readOnly: true
        - name: spyre-senlib
          mountPath: /opt/ibm/spyre/senlib/etc
          subPath: senlib/etc
          readOnly: true
        securityContext:
          privileged: true
      volumes:
      - name: spyre-config
        hostPath:
          path: /usr/local/etc/device-plugins/spyre-config
          type: DirectoryOrCreate
      - name: spyre-metrics
        hostPath:
          path: /usr/local/etc/device-plugins/spyre-metrics
          type: DirectoryOrCreate
      - name: spyre-metadata
        hostPath:
          path: /usr/local/etc/device-plugins/metadata
          type: DirectoryOrCreate
      - name: spyre-senlib
        emptyDir: {}
